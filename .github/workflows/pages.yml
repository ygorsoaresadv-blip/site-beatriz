# Publicação provisória no GitHub Pages (https://ygorsoaresadv-blip.github.io/site-beatriz/)
# enquanto o domínio e a Cloudflare Pages não estão prontos. Roda a cada push na main.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar o site
        run: node scripts/build.mjs
        env:
          SITE_DOMINIO: ygorsoaresadv-blip.github.io/site-beatriz
          BASE_PATH: /site-beatriz
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
